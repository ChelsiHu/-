<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服装进货成本 · 记账本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #fff;
    --text: #2d3436;
    --sub: #636e72;
    --red: #e74c3c;
    --green: #27ae60;
    --border: #e0e4e8;
    --accent: #e74c3c;
    --accent-hover: #c0392b;
    --tag-bg: #f0f2f5;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height:1.6; }

  .container { max-width:960px; margin:0 auto; padding:24px 16px; }

  header { margin-bottom:28px; }
  header h1 { font-size:26px; font-weight:700; display:flex; align-items:center; gap:10px; }
  header h1 .emoji { font-size:30px; }
  header .sub { color:var(--sub); font-size:14px; margin-top:4px; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
  .stat-card { background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
  .stat-card .label { font-size:13px; color:var(--sub); margin-bottom:6px; }
  .stat-card .value { font-size:28px; font-weight:700; }
  .stat-card .value.red { color:var(--red); }
  .stat-card .value.green { color:var(--green); }

  .panel { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:20px; }
  .panel h2 { font-size:17px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px; }

  .form-row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-group label { font-size:13px; color:var(--sub); font-weight:500; }
  .form-group input, .form-group select { padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; outline:none; transition:border .2s; background:#fafbfc; }
  .form-group input:focus, .form-group select:focus { border-color:var(--accent); background:#fff; }
  .form-group input[type="number"] { width:120px; }
  .form-group input[type="text"] { width:200px; }
  .form-group input[type="date"] { width:150px; }
  .form-group select { width:120px; }

  .btn { padding:9px 22px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-hover); }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover { background:var(--tag-bg); }
  .btn-sm { padding:5px 12px; font-size:12px; }
  .btn-danger { background:transparent; color:var(--red); border:1px solid transparent; }
  .btn-danger:hover { background:#fde8e8; }

  .expense-table { width:100%; border-collapse:collapse; font-size:14px; }
  .expense-table th { text-align:left; padding:10px 12px; color:var(--sub); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.5px; border-bottom:2px solid var(--border); }
  .expense-table td { padding:12px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .expense-table tbody tr:hover { background:#fafbfc; }
  .expense-table .amount { font-weight:700; font-size:16px; color:var(--red); }
  .expense-table .category-tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; background:var(--tag-bg); color:var(--sub); }

  .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .chart-box { background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .chart-box h3 { font-size:15px; font-weight:600; margin-bottom:8px; }
  .chart-box canvas { max-height:260px; }

  .empty-state { text-align:center; padding:40px 20px; color:var(--sub); }
  .empty-state .icon { font-size:48px; margin-bottom:12px; }

  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar select { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:#fafbfc; outline:none; }

  .quick-add { display:flex; gap:8px; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .quick-add .hint { font-size:13px; color:var(--sub); flex:1; }

  @media (max-width:700px) {
    .charts-row { grid-template-columns:1fr; }
    .form-row { flex-direction:column; }
    .form-group input, .form-group select { width:100% !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="emoji">👗</span>服装进货 · 记账本</h1>
    <p class="sub">进货成本、推广费用一目了然 · 每月轻松 Check 利润</p>
  </header>

  <!-- 月度统计卡片 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="label">本月总支出</div>
      <div class="value red" id="statTotal">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">本月笔数</div>
      <div class="value" id="statCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">笔均金额</div>
      <div class="value" id="statAvg">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">日均支出</div>
      <div class="value" id="statDaily">¥0</div>
    </div>
  </div>

  <!-- 图表 -->
  <div class="charts-row">
    <div class="chart-box">
      <h3>📊 本月分类占比</h3>
      <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-box">
      <h3>📈 近 6 个月趋势</h3>
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <!-- 记账面板 -->
  <div class="panel" id="addPanel">
    <h2>✏️ 记一笔</h2>
    <div class="form-row">
      <div class="form-group">
        <label>金额 (¥)</label>
        <input type="number" id="inputAmount" placeholder="0.00" step="0.01" min="0.01">
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="inputCategory">
          <option value="服装进货">👗 服装进货</option>
          <option value="推广费用">📣 推广费用</option>
          <option value="物流运费">🚚 物流运费</option>
          <option value="包装耗材">📦 包装耗材</option>
          <option value="店铺租金">🏠 店铺租金</option>
          <option value="水电燃气">⚡ 水电燃气</option>
          <option value="人工工资">👤 人工工资</option>
          <option value="拍摄美工">📸 拍摄美工</option>
          <option value="餐费报销">🍜 餐费报销</option>
          <option value="其他">💡 其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="inputDate">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="inputNote" placeholder="款式、颜色、数量...">
      </div>
      <button class="btn btn-primary" onclick="addExpense()">记 账</button>
    </div>
    <div class="quick-add">
      <span class="hint">💡 快捷方式：在对话中对我说 <strong>「请记账 金额 分类 备注」</strong> 即可快速录入</span>
    </div>
  </div>

  <!-- 记账列表 -->
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <h2 style="margin-bottom:0;">📋 明细列表</h2>
      <div class="toolbar">
        <select id="filterMonth" onchange="renderAll()">
          <option value="">全部月份</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="copyToClipboard()">📋 复制数据</button>
        <button class="btn btn-outline btn-sm" onclick="pasteFromClipboard()">📌 粘贴恢复</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 导入1688订单</button>
        <button class="btn btn-outline btn-sm" onclick="pasteAndParse()">📋 粘贴解析</button>
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 导出 CSV</button>
        <input type="file" id="importFile" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleImport(event)">
      </div>
    </div>
    <div id="expenseList"></div>
  </div>
</div>

<!-- 导入预览弹窗 -->
<div id="importModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow:auto;">
    <h3 style="margin-bottom:12px;">📥 导入1688订单预览</h3>
    <p id="importSummary" style="font-size:13px;color:#636e72;margin-bottom:12px;"></p>
    <div id="importPreview" style="max-height:50vh;overflow:auto;margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-outline btn-sm" onclick="closeImportModal()">取消</button>
      <button class="btn btn-primary btn-sm" id="confirmImportBtn" onclick="confirmImport()">确认导入</button>
    </div>
  </div>
</div>

<script>
// ============ 数据层 ============
const STORAGE_KEY = 'claw_expenses_db';
let expenses = [];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    expenses = raw ? JSON.parse(raw) : [];
  } catch(e) { expenses = []; }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
}

// ============ 业务 ============
function addExpense() {
  const amount = parseFloat(document.getElementById('inputAmount').value);
  const category = document.getElementById('inputCategory').value;
  const date = document.getElementById('inputDate').value;
  const note = document.getElementById('inputNote').value.trim();

  if (!amount || amount <= 0) { alert('请输入有效的金额'); return; }
  if (!date) { alert('请选择日期'); return; }

  expenses.push({
    id: Date.now(),
    amount: Math.round(amount * 100) / 100,
    category,
    date,
    note: note || '-',
    createdAt: new Date().toISOString()
  });
  expenses.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  saveData();
  renderAll();

  document.getElementById('inputAmount').value = '';
  document.getElementById('inputNote').value = '';
  document.getElementById('inputAmount').focus();
}

function deleteExpense(id) {
  if (!confirm('确定删除这笔记录吗？')) return;
  expenses = expenses.filter(e => e.id !== id);
  saveData();
  renderAll();
}

// 快捷记账（供外部 / 对话调用）
function quickAdd(amount, category, note='-') {
  const now = new Date();
  const dateStr = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0');

  // 匹配分类
  const catMap = {
    '进货':'服装进货','拿货':'服装进货','采购':'服装进货','衣服':'服装进货','服装':'服装进货','补货':'服装进货',
    '推广':'推广费用','广告':'推广费用','投流':'推广费用','dou':'推广费用','抖音':'推广费用','朋友圈':'推广费用','信息流':'推广费用',
    '物流':'物流运费','运费':'物流运费','快递':'物流运费','发货':'物流运费','货运':'物流运费',
    '包装':'包装耗材','袋子':'包装耗材','吊牌':'包装耗材','标签':'包装耗材',
    '租金':'店铺租金','房租':'店铺租金','档口':'店铺租金','铺租':'店铺租金',
    '工资':'人工工资','人工':'人工工资','员工':'人工工资','发工资':'人工工资',
    '拍摄':'拍摄美工','照片':'拍摄美工','模特':'拍摄美工','美工':'拍摄美工','修图':'拍摄美工','拍照':'拍摄美工',
    '电费':'水电燃气','水电':'水电燃气','燃气':'水电燃气','水费':'水电燃气','电':'水电燃气','空调':'水电燃气',
    '餐饮':'餐费报销','吃饭':'餐费报销','午餐':'餐费报销','晚餐':'餐费报销','外卖':'餐费报销','报销':'餐费报销','快餐':'餐费报销','盒饭':'餐费报销',
  };
  const matched = Object.keys(catMap).find(k => category.includes(k));
  const finalCat = catMap[matched || category] || '其他';

  expenses.push({
    id: Date.now(),
    amount: Math.round(parseFloat(amount) * 100) / 100,
    category: finalCat,
    date: dateStr,
    note: note || '-',
    createdAt: new Date().toISOString()
  });
  expenses.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  saveData();
  renderAll();
  return { amount, category: finalCat, date: dateStr };
}

// ============ 渲染 ============
function getMonthData() {
  const now = new Date();
  const currentMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const filter = document.getElementById('filterMonth')?.value;
  const target = filter || currentMonth;
  return expenses.filter(e => e.date.startsWith(target));
}

function renderStats() {
  const monthExpenses = getMonthData();
  const total = monthExpenses.reduce((s,e) => s + e.amount, 0);
  const count = monthExpenses.length;
  const avg = count > 0 ? total / count : 0;
  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  const today = new Date().getDate();
  const dailyAvg = today > 0 ? total / today : 0;

  document.getElementById('statTotal').textContent = '¥' + total.toFixed(2);
  document.getElementById('statCount').textContent = count + ' 笔';
  document.getElementById('statAvg').textContent = '¥' + avg.toFixed(2);
  document.getElementById('statDaily').textContent = '¥' + dailyAvg.toFixed(2);
}

function renderList() {
  const monthExpenses = getMonthData();
  const container = document.getElementById('expenseList');

  if (monthExpenses.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>这个月还没有记录，开始记一笔进货成本吧</p></div>';
    return;
  }

  let html = `<table class="expense-table"><thead><tr>
    <th>日期</th><th>分类</th><th>备注</th><th>金额</th><th>操作</th>
  </tr></thead><tbody>`;

  monthExpenses.forEach(e => {
    html += `<tr>
      <td>${e.date}</td>
      <td><span class="category-tag">${e.category}</span></td>
      <td>${e.note}</td>
      <td><span class="amount">¥${e.amount.toFixed(2)}</span></td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteExpense(${e.id})">删除</button></td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderCharts() {
  const monthExpenses = getMonthData();

  // 饼图 — 本月分类
  const catSums = {};
  monthExpenses.forEach(e => { catSums[e.category] = (catSums[e.category]||0) + e.amount; });
  const cats = Object.keys(catSums).sort((a,b) => catSums[b] - catSums[a]);
  const colors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#95a5a6'];

  if (window._pieChart) window._pieChart.destroy();
  const pieCtx = document.getElementById('pieChart').getContext('2d');
  window._pieChart = new Chart(pieCtx, {
    type: 'doughnut',
    data: {
      labels: cats,
      datasets: [{
        data: cats.map(c => catSums[c]),
        backgroundColor: cats.map((_,i) => colors[i % colors.length]),
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { position: 'bottom', labels: { padding: 16, font: { size: 12 } } }
      }
    }
  });

  // 柱状图 — 近 6 个月
  const months = [];
  const monthTotals = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const label = (d.getMonth()+1) + '月';
    months.push(label);
    const total = expenses.filter(e => e.date.startsWith(key)).reduce((s,e) => s + e.amount, 0);
    monthTotals.push(total);
  }

  if (window._barChart) window._barChart.destroy();
  const barCtx = document.getElementById('barChart').getContext('2d');
  window._barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: months,
      datasets: [{
        label: '月支出 (¥)',
        data: monthTotals,
        backgroundColor: '#e74c3c',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => '¥'+v } } }
    }
  });
}

function buildMonthFilter() {
  const sel = document.getElementById('filterMonth');
  const months = [...new Set(expenses.map(e => e.date.substring(0,7)))].sort().reverse();
  sel.innerHTML = '<option value="">全部月份</option>' +
    months.map(m => `<option value="${m}">${m}</option>`).join('');

  const now = new Date();
  const currentMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  if (months.includes(currentMonth)) sel.value = currentMonth;
}

function renderAll() {
  buildMonthFilter();
  renderStats();
  renderList();
  renderCharts();
}

// ============ 导出 ============
function exportCSV() {
  const data = getMonthData();
  if (data.length === 0) { alert('没有数据可导出'); return; }
  const header = '日期,分类,备注,金额\n';
  const rows = data.map(e => `${e.date},${e.category},${e.note},${e.amount}`).join('\n');
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + header + rows], {type:'text/csv;charset=utf-8'});
  downloadBlob(blob, '记账记录.csv');
}

function exportJSON() {
  const data = getMonthData();
  if (data.length === 0) { alert('没有数据可导出'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json;charset=utf-8'});
  downloadBlob(blob, '记账记录.json');
}

async function copyToClipboard() {
  try {
    await navigator.clipboard.writeText(JSON.stringify(expenses, null, 2));
    alert('✅ 已复制 ' + expenses.length + ' 条记录到剪贴板，可以粘贴到微信发给另一台设备');
  } catch(e) {
    alert('复制失败，请手动导出 JSON 文件');
  }
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    const data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('格式不对');
    const before = expenses.length;
    // 合并去重（按 id）
    const existingIds = new Set(expenses.map(e => e.id));
    const newItems = data.filter(e => !existingIds.has(e.id));
    expenses = [...expenses, ...newItems];
    expenses.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
    saveData();
    renderAll();
    alert('✅ 已合并 ' + newItems.length + ' 条新记录（共 ' + expenses.length + ' 条）');
  } catch(e) {
    alert('粘贴失败：请先复制数据（JSON 格式）。操作：另一台设备 → 复制数据 → 发送到微信 → 这台设备复制 → 粘贴恢复');
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ============ URL Hash 自动导入 (来自1688书签抓取) ============
(function checkHashImport() {
  var hash = location.hash;
  if (!hash || !hash.startsWith('#import=')) return;
  try {
    var json = decodeURIComponent(atob(hash.replace('#import=', '')));
    var data = JSON.parse(json);
    if (!data || !data.orders || !Array.isArray(data.orders) || data.orders.length === 0) return;

    importPreviewData = data.orders.map(function(o, i) {
      return {
        id: o.orderId || ('1688_' + Date.now() + '_' + i),
        amount: Math.round(parseFloat(o.amount) * 100) / 100,
        category: '服装进货',
        date: o.date && /^\d{4}-\d{2}-\d{2}$/.test(o.date) ? o.date : new Date().toISOString().split('T')[0],
        note: o.product || '1688订单',
        createdAt: new Date().toISOString()
      };
    });

    var totalAmount = importPreviewData.reduce(function(s, e) { return s + e.amount; }, 0);

    var previewHTML = '<table class="expense-table"><thead><tr><th>日期</th><th>商品</th><th>金额</th></tr></thead><tbody>';
    importPreviewData.forEach(function(e) {
      previewHTML += '<tr><td>' + e.date + '</td><td>' + e.note + '</td><td class="amount">¥' + e.amount.toFixed(2) + '</td></tr>';
    });
    previewHTML += '</tbody></table>';

    document.getElementById('importSummary').textContent =
      '1688自动抓取：共识别 ' + importPreviewData.length + ' 笔订单，合计 ¥' + totalAmount.toFixed(2);
    document.getElementById('importPreview').innerHTML = previewHTML;
    document.getElementById('importModal').style.display = 'flex';

    // 清除 hash
    history.replaceState(null, '', location.pathname);
  } catch(e) {
    console.warn('Hash import error:', e);
  }
})();

document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

// ============ 快捷键 ============
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) {
    e.preventDefault();
    addExpense();

// ============ 导入1688订单 ============
let importPreviewData = [];

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'csv') {
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        encoding: 'UTF-8',
        complete: function(results) {
          if (results.errors.length > 0) console.warn('CSV parse warnings:', results.errors);
          processImportRows(results.data, results.meta.fields);
        }
      });
    };
    reader.readAsText(file, 'UTF-8');
  } else if (ext === 'xlsx' || ext === 'xls') {
    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      const fields = rows.length > 0 ? Object.keys(rows[0]) : [];
      processImportRows(rows, fields);
    };
    reader.readAsArrayBuffer(file);
  }

  event.target.value = '';
}

function findColumn(fields, patterns) {
  for (const p of patterns) {
    const col = fields.find(f => f.includes(p));
    if (col) return col;
  }
  return null;
}

function parseAmount(val) {
  if (typeof val === 'number') return val;
  const s = String(val).replace(/[￥¥, ，\s]/g, '');
  const num = parseFloat(s);
  return isNaN(num) ? 0 : num;
}

function processImportRows(rows, fields) {
  if (!rows.length) { alert('文件中没有数据'); return; }

  // 自动检测列名
  const amountCol = findColumn(fields, ['实付款','实付金额','金额','总价','合计','支付金额','付款金额','订单金额']);
  const productCol = findColumn(fields, ['商品名称','商品标题','货品名称','产品名称','商品','货品']);
  const dateCol = findColumn(fields, ['下单时间','付款时间','创建时间','交易时间','日期','时间']);
  const orderCol = findColumn(fields, ['订单编号','订��号','编号']);
  const qtyCol = findColumn(fields, ['数量','件数']);

  if (!amountCol) { alert('未找到金额列，请确认文件格式。支持的列名：实付款、金额、合计等'); return; }

  importPreviewData = [];
  let totalAmount = 0;

  rows.forEach((row, i) => {
    const amount = parseAmount(row[amountCol]);
    if (amount <= 0) return;

    let date = '';
    if (dateCol && row[dateCol]) {
      const d = new Date(row[dateCol]);
      if (!isNaN(d.getTime())) {
        date = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }
    }
    if (!date) date = new Date().toISOString().split('T')[0];

    let note = '';
    if (productCol && row[productCol]) note += row[productCol];
    if (qtyCol && row[qtyCol]) note += (note ? ' ×' : '') + row[qtyCol];
    if (!note) note = '-';

    importPreviewData.push({
      id: orderCol && row[orderCol] ? ('1688_' + String(row[orderCol]).trim()) : ('imp_' + Date.now() + '_' + i),
      amount: Math.round(amount * 100) / 100,
      category: '服装进货',
      date: date,
      note: note,
      createdAt: new Date().toISOString()
    });
    totalAmount += amount;
  });

  if (importPreviewData.length === 0) { alert('未能解析出有效订单'); return; }

  // 渲染预览
  let previewHTML = '<table class="expense-table"><thead><tr><th>日期</th><th>商品</th><th>金额</th></tr></thead><tbody>';
  importPreviewData.forEach(e => {
    previewHTML += `<tr><td>${e.date}</td><td>${e.note}</td><td class="amount">¥${e.amount.toFixed(2)}</td></tr>`;
  });
  previewHTML += '</tbody></table>';

  document.getElementById('importSummary').textContent =
    `共识别 ${importPreviewData.length} 笔订单，合计 ¥${totalAmount.toFixed(2)}，全部分类为「服装进货」`;
  document.getElementById('importPreview').innerHTML = previewHTML;
  document.getElementById('importModal').style.display = 'flex';
}

function closeImportModal() {
  document.getElementById('importModal').style.display = 'none';
  importPreviewData = [];
}

// ============ 粘贴解析1688订单文本 ============
async function pasteAndParse() {
  try {
    var text = await navigator.clipboard.readText();
    if (!text || text.length < 10) { alert('剪贴板为空或内容太短，请先在1688页面全选复制订单文本'); return; }
    var orders = parse1688Text(text);
    if (!orders.length) { alert('未能从粘贴内容中识别出订单。\n\n请确认复制了1688「已买到的货品」页面的完整内容。'); return; }

    importPreviewData = orders.map(function(o, i) {
      return {
        id: o.orderId || ('1688_' + Date.now() + '_' + i),
        amount: Math.round(parseFloat(o.amount) * 100) / 100,
        category: '服装进货',
        date: o.date && /^\d{4}-\d{2}-\d{2}$/.test(o.date) ? o.date : new Date().toISOString().split('T')[0],
        note: o.product || '1688订单',
        createdAt: new Date().toISOString()
      };
    });

    var totalAmount = importPreviewData.reduce(function(s, e) { return s + e.amount; }, 0);
    var previewHTML = '<table class="expense-table"><thead><tr><th>日期</th><th>商品</th><th>金额</th></tr></thead><tbody>';
    importPreviewData.forEach(function(e) {
      previewHTML += '<tr><td>' + e.date + '</td><td>' + e.note + '</td><td class="amount">¥' + e.amount.toFixed(2) + '</td></tr>';
    });
    previewHTML += '</tbody></table>';

    document.getElementById('importSummary').textContent =
      '粘贴解析：共识别 ' + importPreviewData.length + ' 笔订单，合计 ¥' + totalAmount.toFixed(2);
    document.getElementById('importPreview').innerHTML = previewHTML;
    document.getElementById('importModal').style.display = 'flex';
  } catch(e) {
    alert('读取剪贴板失败：' + e.message + '\n\n请在1688页面 Ctrl+A 全选 → Ctrl+C 复制 → 回到本页点「粘贴解析」');
  }
}

function parse1688Text(text) {
  var orders = [];
  var lines = text.split(/\n/);
  var pricePattern = /[¥￥]\s*(\d+\.?\d{0,2})/g;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var prices = line.match(pricePattern);
    if (!prices) continue;

    // 取这一行最后一个价格作为实付款
    var amount = parseFloat(prices[prices.length-1].replace(/[¥￥\s]/g, ''));
    if (!amount || amount <= 0 || amount > 1000000) continue;

    // 寻找商品名：向前查找（1688通常是 商品名在前，价格在后，或在同一行）
    var product = '';
    // 同一行中去掉价格和数字后的文本
    var productPart = line.replace(pricePattern, '').replace(/[\d.x×\s]+$/g, '').trim();
    if (productPart && productPart.length > 1 && productPart.length < 100) {
      product = productPart;
    } else {
      // 向前找名称行（商品名通常在价格上方1-3行）
      for (var j = i-1; j >= Math.max(0, i-3); j--) {
        var prev = lines[j].trim();
        if (prev && !prev.match(/[¥￥]/) && !prev.match(/^\d+$/) && prev.length > 2 && prev.length < 100) {
          product = prev;
          break;
        }
      }
    }
    if (!product) product = '1688订单';

    // 寻找日期
    var date = '';
    var dateMatch = text.match(/\d{4}-\d{2}-\d{2}/);
    if (dateMatch) date = dateMatch[0];

    // 寻找订单号
    var orderId = '';
    var oidMatch = line.match(/\d{15,20}/);
    if (oidMatch) orderId = oidMatch[0];

    // 去重（同一行多个价格时取最后一个）
    var dup = orders.find(function(o) { return o.amount === amount && o.product === product; });
    if (!dup) {
      orders.push({ amount: amount, product: product, date: date, orderId: orderId });
    }
  }

  return orders;
}

function confirmImport() {
  const existingIds = new Set(expenses.map(e => String(e.id)));
  let addedCount = 0;

  importPreviewData.forEach(row => {
    if (!existingIds.has(String(row.id))) {
      expenses.push(row);
      existingIds.add(String(row.id));
      addedCount++;
    }
  });

  if (addedCount === 0) {
    alert('这些订单已经存在，无需重复导入');
  } else {
    expenses.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
    saveData();
    renderAll();
    alert(`✅ 成功导入 ${addedCount} 笔订单（${importPreviewData.length - addedCount} 笔已存在，已跳过）`);
  }

  closeImportModal();
}
